<title>How spiderpig works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..650;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a reading column with a sticky contents rail beside it on wide screens; figures span the
   column. Colours come from the robot's own materials as spiderpig's viewer draws them: acrylic
   links, amber frame plates, violet printed parts, a red foot path. */
:root {
  --paper: #f4f6f8;
  --surface: #ffffff;
  --ink: #13171c;
  --ink-2: #444d58;
  --muted: #727b86;
  --rule: #dce1e7;
  --code: #eaeef3;
  --accent: #1d6a8a;
  --acrylic: #2a86a8;
  --frame: #d27c26;
  --printed: #7350d4;
  --path: #cf3f37;
  --series: #2a78d6;
  --series-hi: #1c5cab;
  --cgrid: #e1e0d9;
  --cbase: #c3c2b7;
  --shot: #111418;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1115; --surface: #151a20; --ink: #e5e8ec; --ink-2: #b0b7c1; --muted: #838b96;
    --rule: #262c35; --code: #1b2129; --accent: #6cc2df; --acrylic: #57b2d3; --frame: #ec9d51;
    --printed: #a68bf1; --path: #ff6a60; --series: #3987e5; --series-hi: #6da7ec;
    --cgrid: #2c2c2a; --cbase: #383835; --shot: #111418; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1115; --surface: #151a20; --ink: #e5e8ec; --ink-2: #b0b7c1; --muted: #838b96;
  --rule: #262c35; --code: #1b2129; --accent: #6cc2df; --acrylic: #57b2d3; --frame: #ec9d51;
  --printed: #a68bf1; --path: #ff6a60; --series: #3987e5; --series-hi: #6da7ec;
  --cgrid: #2c2c2a; --cbase: #383835; --shot: #111418; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.62;
  font-optical-sizing: auto; -webkit-font-smoothing: antialiased;
}
.page { max-width: 1200px; margin-inline: auto; padding-inline: 20px; padding-block: 28px 80px; }

/* hero */
.hero { display: grid; grid-template-columns: 1fr; gap: 28px; align-items: center;
  padding-block: 12px 36px; border-bottom: 1px solid var(--rule); margin-bottom: 36px; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 44px; } }
.eyebrow { font: 600 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 14px; }
.hero h1 { font-family: var(--font-display); font-stretch: 78%; font-weight: 700;
  font-size: clamp(40px, 6.4vw, 68px); line-height: .98; letter-spacing: -.01em; margin: 0 0 18px;
  text-wrap: balance; }
.hero .lead { font-size: 19px; line-height: 1.55; color: var(--ink); margin: 0 0 12px; max-width: 34em; }
.hero .meta { font: 13px/1.5 var(--font-mono); color: var(--muted); margin: 0; }
.hero figure { margin: 0; }
.hero figcaption { font: 13.5px/1.5 var(--font-display); color: var(--ink-2); margin-top: 10px; }
.swatch { display: inline-block; width: .8em; height: .8em; border-radius: 2px; vertical-align: -.05em; margin-right: .25em; }
.short { grid-column: 1 / -1; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px;
  padding: 18px 22px; }
.short h2 { font: 600 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 10px; border: 0; padding: 0; }
.short ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
@media (min-width: 900px) { .short ul { grid-template-columns: 1fr 1fr; column-gap: 36px; } }

/* layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
@media (min-width: 1040px) {
  .layout { grid-template-columns: 240px minmax(0, 1fr); gap: 56px; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 18px); align-self: start;
    max-height: calc(100vh - 36px); overflow: auto; }
}
.rail details { font-family: var(--font-display); font-size: 13.5px; }
.rail summary { font: 600 12px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); cursor: pointer; padding-block: 6px 10px; }
.toc, .toc ol { list-style: none; margin: 0; padding: 0; }
.toc > li { margin-block: 2px; }
.toc ol { padding-left: 12px; margin-block: 2px 8px; border-left: 1px solid var(--rule); }
.toc a { display: block; padding: 3px 8px; border-radius: 5px; color: var(--ink-2); text-decoration: none; line-height: 1.35; }
.toc > li > a { color: var(--ink); font-weight: 500; }
.toc a:hover { background: var(--code); }
.toc a.on { color: var(--accent); background: var(--code); }
.toc a:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* document */
.doc { min-width: 0; max-width: 780px; }
.doc > * { max-width: 100%; }
.doc p, .doc li { text-wrap: pretty; }
.doc h2, .doc h3, .doc h4 { font-family: var(--font-display); text-wrap: balance; line-height: 1.18;
  scroll-margin-top: 20px; }
.doc h2 { font-size: 30px; font-weight: 650; font-stretch: 85%; margin: 64px 0 16px; padding-top: 22px;
  border-top: 2px solid var(--ink); }
.doc h3 { font-size: 21px; font-weight: 600; margin: 38px 0 10px; }
.doc h2:first-child { margin-top: 0; }
.doc a { color: var(--accent); text-underline-offset: 2px; }
.doc code { font-family: var(--font-mono); font-size: .84em; background: var(--code); padding: .08em .32em; border-radius: 4px; }
.doc pre { background: var(--code); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
.doc pre code { background: none; padding: 0; font-size: 13px; }
.doc ul, .doc ol { padding-left: 1.3em; }
.doc li { margin-block: 4px; }
.doc strong { font-weight: 650; }
.doc blockquote { margin: 0; padding-left: 16px; border-left: 3px solid var(--rule); color: var(--ink-2); }

.table-wrap { overflow-x: auto; margin-block: 18px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
.doc table { border-collapse: collapse; width: 100%; font: 14px/1.45 var(--font-display); }
.doc th, .doc td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
.doc thead th { font-weight: 600; color: var(--ink-2); background: var(--code); }
.doc tbody tr:last-child > * { border-bottom: 0; }
.doc td code, .doc th code { font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }

/* heat table */
.heat td { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; min-width: 4.6em; border: 2px solid var(--surface); }
.heat th[scope="row"] { font-weight: 600; white-space: nowrap; }
.heat td.unproven { box-shadow: inset 0 0 0 2px var(--surface), inset 0 0 0 4px currentColor; }
.star { font-weight: 700; margin-left: 1px; }
.note { font: 13.5px/1.5 var(--font-display); color: var(--ink-2); margin-top: -8px; }

/* figures */
.fig { margin: 26px 0 28px; }
.fig > svg, .fig .table-wrap, .fig .shot { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.fig > svg { padding: 14px; }
.fig .table-wrap { margin: 0 0 12px; }
.fig figcaption { font: 14px/1.5 var(--font-display); color: var(--ink-2); margin-top: 10px; }
.fig figcaption strong { color: var(--ink); }
.fig.narrow .shot { max-width: 520px; }
.shot { background: var(--shot) !important; border-color: var(--shot) !important; overflow: hidden; }
.shot img { display: block; width: 100%; height: auto; }
.layers th[scope="row"] { width: 4.5em; color: var(--muted); }

/* diagrams */
.dia { display: block; width: 100%; height: auto; overflow: visible; }
.dia .lbl { font: 500 12.5px var(--font-display); fill: var(--ink); }
.dia .lk-lbl { font-weight: 700; font-size: 13px; }
.dia .jt-lbl { font-weight: 700; font-size: 13px; }
.dia .mut { fill: var(--muted); }
.dia .inv { fill: var(--surface); font-weight: 600; }
.dia .guide { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
.dia .fp { fill: none; stroke: var(--path); stroke-width: 2; stroke-linejoin: round; }
.dia .ghost { stroke: var(--acrylic); stroke-opacity: .14; stroke-linecap: round; fill: none; }
.dia .ghost-crank { stroke: var(--printed); stroke-width: 2.5; stroke-dasharray: 5 4; fill: none; }
.dia .lk { stroke: var(--acrylic); stroke-opacity: .30; stroke-linecap: round; fill: none; }
.dia .lk-c { stroke: var(--acrylic); stroke-width: 2; fill: none; }
.dia .ck { stroke: var(--printed); stroke-opacity: .55; stroke-linecap: round; fill: none; }
.dia .jt { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.dia .fixed { fill: var(--ink-2); }
.dia .fixed-l, .dia .scale { stroke: var(--ink-2); stroke-width: 2; fill: none; }
.dia .grid { stroke: var(--rule); stroke-width: 1; }
.dia .plate { fill: var(--frame); fill-opacity: .6; }
.dia .servo { fill: var(--ink-2); }
.dia .axis { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 6 4; fill: none; }
.dia .link-b { fill: var(--acrylic); fill-opacity: .42; }
.dia .crank { fill: var(--printed); }
.dia .horn { fill: var(--muted); }
.dia .screw { stroke: var(--ink); stroke-width: 2; }
.dia .screw-h { fill: var(--ink); }
.dia .bracket { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.dia.dxf .sheet { fill: var(--paper); stroke: var(--rule); stroke-width: .8; }
.dia.dxf .cut { fill: none; stroke: var(--acrylic); stroke-width: .7; }
.dia.dxf .lbl { font-size: 9px; }

/* charts */
.chart { display: block; width: 100%; height: auto; }
.chart-fig > svg { padding: 16px 16px 8px; }
.chart .cgrid { stroke: var(--cgrid); stroke-width: 1; }
.chart .cbase { stroke: var(--cbase); stroke-width: 1; }
.chart .bar { fill: var(--series); transition: fill .12s; }
.chart .hit { fill: transparent; }
.chart .mark { cursor: default; outline: none; }
.chart .mark:hover .bar, .chart .mark:focus .bar { fill: var(--series-hi); }
.chart .clbl { font: 12px var(--font-display); fill: var(--muted); }
.chart .clbl2 { font: 13px var(--font-display); fill: var(--ink-2); }
.chart .cval { font: 600 13px var(--font-display); fill: var(--ink); }

#tip { position: fixed; z-index: 10; pointer-events: none; max-width: 280px; background: var(--ink); color: var(--paper);
  font: 13px/1.4 var(--font-display); padding: 7px 10px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.22); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 600px) {
  body { font-size: 16.5px; }
  .doc h2 { font-size: 25px; margin-top: 48px; }
  .fig > svg { padding: 8px; }
}
</style>

<div class="page">
  <header class="hero">
    <div>
      <p class="eyebrow">Architecture report · spiderpig</p>
      <h1>How spiderpig works</h1>
      <p class="lead">{{LEAD}}</p>
      <p class="meta">{{META}}</p>
    </div>
    <figure>
      <div class="shot"><img src="img/robot_three_quarter.webp" alt="The default eight-legged Klann robot rendered in spiderpig's viewer" width="1400" height="1019"></div>
      <figcaption>The running example in spiderpig's own viewer: a Klann robot with four legs a side, built
        from <span class="swatch" style="background:var(--acrylic)"></span>laser-cut acrylic links,
        <span class="swatch" style="background:var(--frame)"></span>frame plates and
        <span class="swatch" style="background:var(--printed)"></span>printed axles and crank. The
        <span class="swatch" style="background:var(--path)"></span>red loop is one foot's path.</figcaption>
    </figure>
    <section class="short" aria-label="In short">
      <h2>In short</h2>
      {{SHORT}}
    </section>
  </header>

  <div class="layout">
    <nav class="rail" aria-label="Contents">
      <details open id="toc-box"><summary>Contents</summary>
        {{TOC}}
      </details>
    </nav>
    <main class="doc">
      {{BODY}}
    </main>
  </div>
</div>
<div id="tip" hidden></div>

<script>
(function () {
  var tip = document.getElementById('tip');
  function show(el, x, y) {
    tip.textContent = el.getAttribute('data-tip');
    tip.hidden = false;
    var r = tip.getBoundingClientRect();
    var left = Math.min(x + 14, window.innerWidth - r.width - 8);
    var top = y - r.height - 12;
    if (top < 8) top = y + 18;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = top + 'px';
  }
  document.querySelectorAll('[data-tip]').forEach(function (el) {
    el.addEventListener('pointermove', function (e) { show(el, e.clientX, e.clientY); });
    el.addEventListener('pointerleave', function () { tip.hidden = true; });
    el.addEventListener('focus', function () {
      var r = el.getBoundingClientRect();
      show(el, r.left + r.width / 2, r.top);
    });
    el.addEventListener('blur', function () { tip.hidden = true; });
  });

  var box = document.getElementById('toc-box');
  if (window.matchMedia && !window.matchMedia('(min-width: 1040px)').matches) box.removeAttribute('open');

  var links = {};
  document.querySelectorAll('.toc a').forEach(function (a) { links[a.getAttribute('href').slice(1)] = a; });
  if ('IntersectionObserver' in window) {
    var current = null;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting && links[en.target.id]) {
          if (current) current.classList.remove('on');
          current = links[en.target.id];
          current.classList.add('on');
        }
      });
    }, { rootMargin: '0px 0px -75% 0px' });
    document.querySelectorAll('.doc h2[id], .doc h3[id]').forEach(function (h) { io.observe(h); });
  }
})();
</script>
