[tools]
python = "3.12"
uv     = "latest"
node   = "22"

[env]
UV_PROJECT_ENVIRONMENT = ".venv"

[tasks.view]
description = "Dev: FastAPI + Vite with HMR (per-worktree ports; URL in the banner)"
depends     = ["viewer-install"]
run         = "uv run python -m spiderpig.tools.dev"

[tasks.viewer-install]
description = "Install npm deps for viewer/"
dir         = "{{config_root}}/viewer"
run         = "npm install"
# sources and outputs resolve against `dir` (viewer/), not the config root: with the
# `viewer/` prefix neither existed, so the task ran every time; npm writes the hidden lockfile
sources     = ["package.json", "package-lock.json"]
outputs     = ["node_modules/.package-lock.json"]

[tasks.viewer-dev]
description = "Vite dev server only"
dir         = "{{config_root}}/viewer"
run         = "npm run dev"

[tasks.viewer-build]
description = "Build the viewer into spiderpig/viewer/dist (package data: what `spiderpig view` serves)"
depends     = ["viewer-install"]
dir         = "{{config_root}}/viewer"
run         = "npm run build"

[tasks.bake]
description = "Bake <store>/bakes/<design>.glb (pass -- --module single --side etc.)"
run         = "uv run python -m spiderpig.cli bake"

[tasks.build]
description = "Robot (default: the Strider double; pass -- --linkage klann, --module single etc.): STEP/STL, print STLs, DXF sheets, BOM -> build/"
run         = "uv run python -m spiderpig.cli build"

[tasks.guide]
description = "The assembly guide: ASSEMBLY.pdf (steps with pictures, parts, prints, bag labels) and ASSEMBLY.md -> build/ (pass -- the build options, --jobs N, --steps N)"
run         = "uv run python -m spiderpig.cli guide"

[tasks.explain]
description = "What each pipeline stage says about a design (pass -- --linkage K --module M)"
run         = "uv run python -m spiderpig.cli explain"

[tasks.tune]
description = "Search crank phases (and proportions) for a smoother walk (pass -- --module decker)"
run         = "uv run python -m spiderpig.cli tune"

[tasks.sim]
description = "Simulate the walker in MuJoCo and print how it walks"
run         = "uv run python -m spiderpig.cli sim"

[tasks.report]
description = "Compare every registered linkage -> build/linkages.json"
run         = "uv run python -m spiderpig.cli report"

[tasks.test]
description = "pytest (unit; pass -m e2e for browser tests)"
depends     = ["viewer-build"]
run         = "uv run pytest"

[tasks."test-quick"]
description = "The quick tier for iteration: pytest -m 'not slow' on local cores (pass more pytest args after --)"
run         = "uv run pytest -p no:warnings -m 'not slow and not e2e' -n 4 --dist worksteal"

# The module tiers (docs/agentlib/TESTING.md): -m "<module> and not slow and not e2e" -n 4,
# on the fabrication cache (tests/cache.py); pass pytest args after --.
[tasks."test-linkage"]
description = "Fast tier: linkages, kinematics, the walk model"
run         = "uv run python -m tests.tiers linkage"

[tasks."test-planner"]
description = "Fast tier: the layer planner, the crank router, recommendations"
run         = "uv run python -m tests.tiers planner"

[tasks."test-construction"]
description = "Fast tier: constructions, fabrication, contract and clashes"
run         = "uv run python -m tests.tiers construction"

[tasks."test-hardware"]
description = "Fast tier: catalog, BOM, order, layout, cut rules"
run         = "uv run python -m tests.tiers hardware"

[tasks."test-strength"]
description = "Fast tier: joint strength, wobble, loads"
run         = "uv run python -m tests.tiers strength"

[tasks."test-api"]
description = "Fast tier: the agent API, store, verify, MCP, CLI build"
run         = "uv run python -m tests.tiers api"

[tasks."test-sim"]
description = "Fast tier: MuJoCo and the glTF bake"
run         = "uv run python -m tests.tiers sim"

[tasks."test-server"]
description = "Fast tier: the viewer's server and spiderpig view"
run         = "uv run python -m tests.tiers server"

[tasks."test-viewer"]
description = "The viewer's TypeScript: typecheck, then its vitest unit tests (src/**/*.test.ts)"
depends     = ["viewer-install"]
dir         = "{{config_root}}/viewer"
run         = "npm run typecheck && npm test"

[tasks."test-fixtures"]
description = "Regenerate the recorded fixtures (tests/fixtures/): their currency tests with --regen"
run         = "uv run python -m tests.tiers fixtures"

[tasks.gate]
description = "Identity gate: snapshot DIR before a product change, compare DIR after; doc DIR writes docs/agentlib/DESIGNS.md (tests/gate/identity_gate.py)"
run         = "uv run python tests/gate/identity_gate.py"

[tasks.remote]
description = "Run a command on $SPIDERPIG_REMOTE (default root@ao-server) in a synced copy of this worktree (e.g. mise run remote -- uv run python -m spiderpig.cli audit); logs and build/ come back to build/remote/<run>/"
run         = "uv run python -m spiderpig.tools.remote --"

[tasks."remote-test"]
description = "The full suite on $SPIDERPIG_REMOTE with xdist (pass pytest args after --); junit + log in build/remote/<run>/. The viewer's tests (typecheck, vitest: the walk-model parity) run here first: the remote has no node_modules, where tests/test_viewer_parity.py skips"
depends     = ["test-viewer"]
run         = "uv run python -m spiderpig.tools.remote --test --"

[tasks."remote-audit"]
description = "Each module's audit on $SPIDERPIG_REMOTE, one process per module (pass audit options after --, e.g. --linkage klann); reports in build/remote/<run>/audit/<module>/. Every module of the linkage (the Strider's quad plans since max_top 60, 2026-10-04)"
run         = '''uv run python -m spiderpig.tools.remote -- bash -c 'mods="single double decker quad"; for m in $mods; do uv run --no-sync python -m spiderpig.cli audit --modules $m --out build/audit/$m "$@" > build/audit-$m.log 2>&1 & done; rc=0; for p in $(jobs -p); do wait $p || rc=1; done; for m in $mods; do tail -n 3 build/audit-$m.log; done; exit $rc' audit'''

[tasks.mcp]
description = "Serve the agent-facing API over MCP on stdio (pass -- --store PATH); for an MCP client's config, not a terminal"
run         = "uv run python -m spiderpig.cli mcp"

[tasks.fetch-cad]
description = "Download the servo manufacturers' CAD models into the cache (sha256-pinned)"
run = "uv run python -m spiderpig.servos.cad"

[tasks.lint]
description = "ruff check, then the layers' import contracts (lint-imports: pyproject.toml [tool.importlinter])"
run         = ["uv run ruff check .", "uv run lint-imports"]

[tasks.release]
description = "Build the viewer, then the sdist + wheel into dist/ (the wheel carries spiderpig/viewer/dist; a build without it fails)"
depends     = ["viewer-build"]
run         = "uv build"

[tasks.audit]
description = "Fabrication audit per module: plan re-check, construction contract, robot clashes, solids, DXF packing, BOM -> build/audit/"
run         = "uv run python -m spiderpig.cli audit"

[tasks.kill]
description = "Stop dev servers spawned from THIS worktree (path-scoped, parallel-worktree-safe)"
run         = "uv run python -m spiderpig.tools.kill_dev --mine"

[tasks."kill-port"]
description = "Force-stop whoever is listening on a TCP port (e.g. mise run kill-port -- --port 5173)"
run         = "uv run python -m spiderpig.tools.kill_dev"

[tasks.clean]
description = "Remove build/, dist/, .spiderpig/bakes/, spiderpig/viewer/dist/, viewer/node_modules/"
run         = "uv run python -c \"import shutil, pathlib; [shutil.rmtree(p, ignore_errors=True) for p in [pathlib.Path('build'), pathlib.Path('dist'), pathlib.Path('.spiderpig/bakes'), pathlib.Path('spiderpig/viewer/dist'), pathlib.Path('viewer/node_modules')]]\""

[tasks.scorecard]
description = "Every roadmap number in one JSON: build stages, tier times, quick-tier coverage, pyright, ruff RUF, module sizes -> build/scorecard.json (--gate/--full/--audit opt-in; --compare A B)"
depends     = ["viewer-install"]
run         = "uv run python -m tests.scorecard"

[tasks.doc-check]
description = "Resolve every backticked name, path, task, flag and env var in the docs against the code (report-only; -- --strict fails on a miss)"
run         = "uv run python -m tests.doc_check"

[tasks.pyright]
description = "pyright, basic mode ([tool.pyright]; the viewer's pinned devDependency)"
depends     = ["viewer-install"]
run         = "viewer/node_modules/.bin/pyright"

[tasks."pyright-check"]
description = "pyright's ratchet (CI): its error count against tests/pyright-baseline.json, which may only go down (-- --update lowers it)"
depends     = ["viewer-install"]
run         = "uv run python -m tests.pyright_baseline"

[tasks."engine-version"]
description = "Print the engine version (the stores' and the test cache's key)"
run         = "uv run python -m spiderpig.tools.engine_version"
