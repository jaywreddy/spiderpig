# Opt-in hooks (`uvx pre-commit install` in a checkout; nothing installs them globally):
# the same ruff as `mise run lint` (the locked version) and the lock's consistency, as CI.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --locked --only-dev ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
