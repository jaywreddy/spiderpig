[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spiderpig"
version = "0.1.0"
description = "Walking-linkage mechanism generator (Klann, Jansen, Strider, ...) for laser cutting and 3D printing: an agent-facing API and MCP server, and a viewer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "sympy>=1.14",
    "build123d>=0.10,<0.12",
    "ezdxf>=1.4",
    "rectpack>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "watchfiles>=1.0",
    "pygltflib>=1.16",
    "mujoco>=3.14.0",
    "mcp>=2.2",
    # imported directly (spiderpig/mcp/, spiderpig/server/app.py), not only through
    # fastapi / mcp: floors at what uv.lock resolves
    "pydantic>=2.13",
    "anyio>=4.13",
    "starlette>=1.0",
    # OCP (OCC's bindings) is imported directly too, but comes with build123d as
    # cadquery-ocp, whose version build123d pins: left implicit
    "reportlab>=5.0.1",
]

[project.scripts]
spiderpig = "spiderpig.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
    "httpx>=0.28.1",
    "pytest-xdist>=3.8.0",
    "coverage>=7.16.2",
    "pytest-cov>=7.1.0",
    "import-linter>=2.15",
]

[tool.uv]
package = true

# The wheel is the package plus the built viewer (spiderpig/viewer/dist, Vite's outDir:
# git-ignored, so it must be named as an artifact). hatch_build.py refuses to build a
# wheel or sdist without it (an editable install, `uv sync`, is exempt) and checks the
# result carries index.html and nothing of viewer/ (sources, node_modules).
[tool.hatch.build]
artifacts = ["spiderpig/viewer/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["spiderpig"]

[tool.hatch.build.targets.sdist]
include = ["spiderpig/**", "pyproject.toml", "README.md", "hatch_build.py"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "NPY"]
# W6 (docs/agentlib/ROADMAP.md): ruff's own rules, comprehensions, performance, returns, blind
# excepts and pylint's errors
extend-select = ["RUF", "C4", "PERF", "PIE", "RET", "BLE", "PLE"]
# the math and units the strings and docstrings write on purpose: ×, the en dash of a range,
# the minus sign
allowed-confusables = ["×", "–", "−"]

[tool.ruff.lint.per-file-ignores]
# the split packages re-export every name of the module they were (W5); __all__ keeps the
# old public list
"spiderpig/api/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = [
    "e2e: end-to-end Playwright tests (opt-in; run with `pytest -m e2e`)",
    "slow: the bakes, the CLI build, the MuJoCo runs and the gait tuner (`-m 'not slow'` to skip)",
    "fixture_regen: a recorded fixture's currency test (also slow; `mise run test-fixtures` runs them with --regen)",
    "no_fabricate: a seam test: fails if spiderpig.fabricate.fabricate or fabricate_side runs (tests/conftest.py)",
    # one module marker per test (tests/_modules.py gives each file's default; docs/agentlib/TESTING.md)
    "linkage: linkages, kinematics, the walk model (`mise run test-linkage`)",
    "planner: the layer planner, the crank router, recommendations (`mise run test-planner`)",
    "construction: constructions, fabrication, contract and clashes (`mise run test-construction`)",
    "hardware: catalog, BOM, order, layout, cut rules (`mise run test-hardware`)",
    "strength: joint strength, wobble, loads (`mise run test-strength`)",
    "api: the agent API, store, verify, MCP, CLI build (`mise run test-api`)",
    "sim: MuJoCo and the glTF bake (`mise run test-sim`)",
    "server: the viewer's server and `spiderpig view` (`mise run test-server`)",
]

# pyright (viewer/node_modules/.bin/pyright, a pinned viewer devDependency; `mise run
# pyright`): basic mode, measured by the scorecard (tests/scorecard.py) and ratcheted in CI
# (`mise run pyright-check`, tests/pyright_baseline.py: the error count only goes down). The
# compiled extensions without stubs (OCP, mujoco) get typings/: their names are Any, which
# silences their noise without turning a rule off anywhere else.
[tool.pyright]
include = ["spiderpig"]
exclude = ["**/node_modules", "**/__pycache__", "spiderpig/viewer/dist", "build", ".spiderpig"]
stubPath = "typings"
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingModuleSource = false
# basic mode leaves it off; a name a branch may not have bound is a bug waiting (W6)
reportPossiblyUnboundVariable = "error"

# coverage.py over the package (the scorecard's quick-tier coverage: pytest-cov, which
# combines the xdist workers' data)
[tool.coverage.run]
source = ["spiderpig"]
omit = ["spiderpig/viewer/*"]
# measure the Python subprocesses too (spiderpig.workers' jobs, the CLI runs): pytest-cov 7
# no longer does; coverage.py's own patch, their data combined with the run's
patch = ["subprocess"]

[tool.coverage.report]
skip_empty = true

# The engine's layers (docs/agentlib/ROADMAP.md, W5): a layer imports only those under it.
# `uv run lint-imports` (`mise run lint`, CI), with no exceptions.
[tool.importlinter]
root_package = "spiderpig"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
# The front-ends may start one another (the MCP's `view` tool runs the viewer's server:
# `:`, not independent). The strength check rates the joints at the sim's loads, so it
# sits over the sim.
layers = [
    "spiderpig.mcp : spiderpig.server : spiderpig.cli",
    "spiderpig.api",
    "spiderpig.bake | spiderpig.build | spiderpig.strength | spiderpig.guide",
    "spiderpig.sim | spiderpig.stages",
    "spiderpig.fabricate",
    "spiderpig.construction",
    "spiderpig.stack",
    "spiderpig.linkage",
]
# No written exceptions: `spiderpig bake` / `build` and the build's up-to-date check plan
# through the store from `spiderpig.stages` (resolve, plan_config), which the API re-exports.

[[tool.importlinter.contracts]]
name = "hardware and materials sit beside construction"
type = "forbidden"
source_modules = ["spiderpig.hardware", "spiderpig.materials"]
forbidden_modules = ["spiderpig.construction"]
