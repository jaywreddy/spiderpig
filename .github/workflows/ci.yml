# Every check on every PR and every push to master, and on a manual run (Actions > CI > Run
# workflow, or `gh workflow run ci.yml --ref BRANCH`): ruff, pyright, the lock, the viewer's
# typecheck, vitest and audit, the quick tier, the doc check, the slow tier, the browser
# tests and the identity gate's determinism check. Nothing on a schedule: a night with no new
# commit has nothing new to test (docs/agentlib/DECISIONS.md, 2026-11-17). Over 43 runs the
# slow tier took 9-28 min, a cold cache included, the browser tests 15 and the gate 9.
# The full suite stays on `mise run remote-test`.
# Every job on ubuntu-24.04, not ubuntu-latest: the recorded fixtures (masses, MJCF, bakes)
# are byte-exact, and the system libm's last bits move them. ubuntu-latest became 26.04 on
# 2026-11-07 and three recorded MJCFs stopped matching (docs/agentlib/TESTING.md, "CI").
# Moving the image means re-recording them there (`mise run test-fixtures`) in one PR.
# The runner's CPU moves them too (numpy's BLAS kernels): tests/conftest.py pins those.
name: CI

on:
  push:
    branches: [master]          # a PR's branch runs once, as the PR
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR (or to master) cancels its older run: the newer commit holds it
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SPIDERPIG_OFFLINE: "1"          # never download a servo's CAD model: parametric servos
  UV_PYTHON: "3.12"
  FORCE_COLOR: "1"
  # the planner's CPU budget, pinned: the node budgets alone bound a search (as the identity
  # gate's), so how far a plan gets doesn't depend on the runner's speed
  SPIDERPIG_PLAN_SECONDS: "3600"

jobs:
  ruff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --locked --only-dev ruff check .
      # the engine's layers (pyproject.toml [tool.importlinter]; reads the sources, imports none)
      - run: uv run --locked --only-dev lint-imports

  # pyright's ratchet (tests/pyright_baseline.py): the error count may only go down. pyright is
  # the viewer's pinned devDependency; the venv gives it the package's imports
  pyright:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: uv run --locked python -m tests.pyright_baseline

  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv lock --check

  test-viewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run typecheck && npm test
        working-directory: viewer
      # what ships in the bundle (three) at any severity; the dev tooling (vite's dev server
      # answers behind `tailscale serve`) at high or critical, less the dated exceptions in
      # audit-dev.mjs (an advisory with no fixed release that can't reach this repo)
      - run: npm audit --omit=dev && node audit-dev.mjs
        working-directory: viewer

  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # the viewer's vitest runs inside the quick tier too (the walk-model parity test):
      # with node and its packages here, SPIDERPIG_REQUIRE_VIEWER_TESTS=1 makes a skip a failure
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      # the fabrication cache (tests/cache.py) keyed by the engine version: its folders are
      # named by the engine version and the library versions too, so an entry restored for
      # another engine is never read (no restore-keys: a new engine starts empty). The
      # runner image ($ImageOS) is in the key too: another image's libm builds other bits
      - id: engine
        run: |
          echo "version=$(uv run --locked python -m spiderpig.tools.engine_version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
      - name: quick tier
        env:
          SPIDERPIG_REQUIRE_VIEWER_TESTS: "1"
        run: uv run --locked pytest -p no:warnings -m 'not slow and not e2e' -n 4 --dist worksteal
      # saved even when a test failed: entries are written whole (renamed into place)
      - if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}

  doc-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # blocking since W7: a backticked name, path, task, flag or env var in the docs that
      # the code doesn't have fails the run (tests/doc_check_allow.txt for what isn't code)
      - run: uv run --locked python -m tests.doc_check --strict

  # The slow tier (`-m 'slow and not e2e'`). Its fabrication cache under its own key (the
  # quick job's is immutable once saved), starting from the quick job's entries for the
  # same engine when it has none of its own
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # the walk-model parity test runs the viewer's vitest: with node and its packages
      # here, SPIDERPIG_REQUIRE_VIEWER_TESTS=1 makes a skip a failure (as the quick job)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - id: engine
        run: |
          echo "version=$(uv run --locked python -m spiderpig.tools.engine_version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-slow-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
          restore-keys: |
            test-cache-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
      # which CPU this runner has (AMD or Intel: its BLAS kernels, which tests/conftest.py pins)
      - run: grep -m1 'model name' /proc/cpuinfo
      - name: slow tests
        env:
          SPIDERPIG_REQUIRE_VIEWER_TESTS: "1"
        run: uv run --locked pytest -p no:warnings -m "slow and not e2e" -n 4 --dist worksteal --durations 25
      - if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-slow-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}

  # The browser tests against the built viewer (`-m e2e`)
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      SPIDERPIG_REQUIRE_VIEWER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      # mise.toml's tools (python, uv, node 22) and its tasks: `mise run viewer-build`
      # writes spiderpig/viewer/dist, which the e2e server mounts (tests/conftest.py)
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: uv sync --locked
      - run: mise run viewer-build
      # Playwright's Chromium and the system libraries it needs (apt: the runner's sudo)
      - run: uv run --locked playwright install --with-deps chromium
      # the system EGL that Chromium's GL flags load (tests/e2e/conftest.py): without it
      # WebGL falls back to SwiftShader, too slow for the drive tests; no GPU here, so mesa
      # renders with llvmpipe
      - run: sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
      - id: engine
        run: |
          echo "version=$(uv run --locked python -m spiderpig.tools.engine_version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-e2e-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
          restore-keys: |
            test-cache-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
      # one browser at a time: each test bakes its mode on first request into one store
      - name: browser tests
        env:
          SPIDERPIG_SHOTS: ${{ runner.temp }}/shots
        run: uv run --locked pytest -p no:warnings -m e2e tests/e2e --browser chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-e2e-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}

  # the identity gate (tests/gate/identity_gate.py) as a determinism check: no baseline
  # here (it is a snapshot on a developer's disk, docs/agentlib/TESTING.md), so two
  # snapshots of this tree, each from a fresh store, must be identical (compare exits 0; 1 is
  # "order differs", 2 "DIFFERENT"; 3 a design failing its own audit that
  # KNOWN_AUDIT_FAILURES doesn't explain, the snapshots identical; 4 and 5 are 1 and 2 with
  # such an audit failure too); the second checks the contract exactly at every angle
  # (GATE_EXACT_CONTRACT: check_side, not the audit's check_sides), so the fast and the exact
  # contract are compared on the gate's designs on every run. An audit failure in the first
  # snapshot (exit 3: the snapshot itself is whole) doesn't skip the compare: the run's
  # determinism verdict is still had, and the job fails after it
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - id: snapshot
        name: snapshot
        run: |
          rc=0
          uv run --locked python tests/gate/identity_gate.py snapshot "$RUNNER_TEMP/gate-a" -j 2 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 3 ]; then
            echo "::error::a design fails its own audit (exit 3): the compare runs, the job fails after it"
          fi
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
      - name: snapshot again (the contract exactly) and compare
        env:
          GATE_EXACT_CONTRACT: "1"
        run: uv run --locked python tests/gate/identity_gate.py compare "$RUNNER_TEMP/gate-a" -j 2 --out "$RUNNER_TEMP/gate-b"
      - name: the first snapshot's audits
        if: steps.snapshot.outputs.rc == '3'
        run: |
          echo "::error::the first snapshot's audit failed (exit 3; its report is in the snapshot step's log)"
          exit 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-snapshots
          path: |
            ${{ runner.temp }}/gate-a
            ${{ runner.temp }}/gate-b
          if-no-files-found: ignore
