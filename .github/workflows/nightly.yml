# What ci.yml leaves out, nightly on master when master has moved since its last Nightly
# (the `changed` job), and on request whatever it holds: the slow tests, the browser
# tests against the built viewer, and the identity gate as a determinism check. CI has no
# gate baseline (it is a snapshot on a developer's disk, docs/agentlib/TESTING.md), so the
# gate job snapshots the tree twice, each in a fresh store, and compares them: a design
# that builds differently from one run to the next fails it. On ubuntu-24.04, as ci.yml
# (its header says why), and the caches keyed by the image as there.
name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"        # 06:17 UTC, off the hour's rush
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  SPIDERPIG_OFFLINE: "1"          # never download a servo's CAD model: parametric servos
  UV_PYTHON: "3.12"
  FORCE_COLOR: "1"
  # the planner's CPU budget, pinned as ci.yml's (the gate sets its own, the same)
  SPIDERPIG_PLAN_SECONDS: "3600"

jobs:
  # A scheduled night with nothing new on master runs nothing: the commit it would test has
  # had a Nightly already (any that finished, not a cancelled one; a red one stays red until
  # the next commit or a manual run). A manual run (workflow_dispatch) always runs
  changed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior=0
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # the API unreachable: run (a night tested twice, never a commit untested)
            prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" \
              -q "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | length") || prior=0
          fi
          if [ "$prior" -gt 0 ]; then
            echo "::notice::nothing new on master: $GITHUB_SHA has had $prior Nightly run(s) already"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  slow:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      # the walk-model parity test runs the viewer's vitest: with node and its packages
      # here, SPIDERPIG_REQUIRE_VIEWER_TESTS=1 makes a skip a failure (as the quick job)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      # the fabrication cache (tests/cache.py), as the quick job keeps it: folders named by
      # the engine and library versions, so nothing restored for another engine is read.
      # Its own key (the quick job's is immutable once saved); it starts from the quick
      # job's entries for the same engine when it has none of its own
      - id: engine
        run: |
          echo "version=$(uv run --locked python -m spiderpig.tools.engine_version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-nightly-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
          restore-keys: |
            test-cache-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
      # which CPU this runner has (AMD or Intel: its BLAS kernels, which tests/conftest.py pins)
      - run: grep -m1 'model name' /proc/cpuinfo
      - name: slow tests
        env:
          SPIDERPIG_REQUIRE_VIEWER_TESTS: "1"
        run: uv run --locked pytest -p no:warnings -m "slow and not e2e" -n 4 --dist worksteal --durations 25
      - if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-nightly-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}

  e2e:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      SPIDERPIG_REQUIRE_VIEWER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      # mise.toml's tools (python, uv, node 22) and its tasks: `mise run viewer-build`
      # writes spiderpig/viewer/dist, which the e2e server mounts (tests/conftest.py)
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: uv sync --locked
      - run: mise run viewer-build
      # Playwright's Chromium and the system libraries it needs (apt: the runner's sudo)
      - run: uv run --locked playwright install --with-deps chromium
      # the system EGL that Chromium's GL flags load (tests/e2e/conftest.py): without it
      # WebGL falls back to SwiftShader, too slow for the drive tests; no GPU here, so mesa
      # renders with llvmpipe
      - run: sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0
      - id: engine
        run: |
          echo "version=$(uv run --locked python -m spiderpig.tools.engine_version)" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-e2e-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
          restore-keys: |
            test-cache-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}
      # one browser at a time: each test bakes its mode on first request into one store
      - name: browser tests
        env:
          SPIDERPIG_SHOTS: ${{ runner.temp }}/shots
        run: uv run --locked pytest -p no:warnings -m e2e tests/e2e --browser chromium
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/spiderpig/test-cache
          key: test-cache-e2e-${{ runner.os }}-${{ steps.engine.outputs.image }}-${{ steps.engine.outputs.version }}-${{ hashFiles('uv.lock', 'tests/cache.py') }}

  # the identity gate (tests/gate/identity_gate.py) as a determinism check: no baseline
  # here, so two snapshots of this tree, each from a fresh store, must be identical
  # (compare exits 0; 1 is "order differs", 2 "DIFFERENT"; 3 a design failing its own
  # audit that KNOWN_AUDIT_FAILURES doesn't explain, the snapshots identical; 4 and 5 are 1
  # and 2 with such an audit failure too); the second checks the contract exactly at every
  # angle (GATE_EXACT_CONTRACT: check_side, not the audit's check_sides), so the fast and
  # the exact contract are compared on the gate's designs every night. An audit failure
  # in the first snapshot (exit 3: the snapshot itself is whole) doesn't skip the compare:
  # the night's determinism verdict is still had, and the job fails after it
  gate:
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - id: snapshot
        name: snapshot
        run: |
          rc=0
          uv run --locked python tests/gate/identity_gate.py snapshot "$RUNNER_TEMP/gate-a" -j 2 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 3 ]; then
            echo "::error::a design fails its own audit (exit 3): the compare runs, the job fails after it"
          fi
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
      - name: snapshot again (the contract exactly) and compare
        env:
          GATE_EXACT_CONTRACT: "1"
        run: uv run --locked python tests/gate/identity_gate.py compare "$RUNNER_TEMP/gate-a" -j 2 --out "$RUNNER_TEMP/gate-b"
      - name: the first snapshot's audits
        if: steps.snapshot.outputs.rc == '3'
        run: |
          echo "::error::the first snapshot's audit failed (exit 3; its report is in the snapshot step's log)"
          exit 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-snapshots
          path: |
            ${{ runner.temp }}/gate-a
            ${{ runner.temp }}/gate-b
          if-no-files-found: ignore
